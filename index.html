<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Project - Todo Task Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light min-vh-100 d-flex flex-column justify-content-center align-items-center py-5">

    <div class="container" style="max-width: 540px;">
        <!-- การ์ดข้อมูลนักศึกษา -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body bg-white rounded">
                <h6 class="card-subtitle text-muted mb-2 text-uppercase fw-bold"
                    style="font-size: 0.75rem; letter-spacing: 0.5px;">Student Information</h6>
                <div class="row text-secondary">
                    <div class="col-sm-6 mb-1 mb-sm-0">
                        <small class="d-block text-muted">Name</small>
                        <span class="fw-medium text-dark">อาทิตย์ ขบวนแก้ว</span>
                    </div>
                    <div class="col-sm-6">
                        <small class="d-block text-muted">Student ID</small>
                        <span class="fw-medium text-dark">683170010121</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- การ์ดจัดการงาน (Task Management) -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3 border-0">
                <h5 class="card-title mb-0 fw-semibold text-center">Task Management Application</h5>
            </div>
            <div class="card-body p-4">

                <!-- ฟอร์มเพิ่มรายการ -->
                <div class="input-group mb-4">
                    <input type="text" id="taskInput" class="form-control form-control-lg fs-6"
                        placeholder="Enter a new task..." aria-label="New task">
                    <button class="btn btn-primary px-4 fw-medium" type="button" onclick="addTask()">
                        <i class="bi bi-plus-lg me-1"></i>Add
                    </button>
                </div>

                <!-- รายการงาน -->
                <ul class="list-group list-group-flush border-top border-bottom mb-3" id="taskList">
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3 bg-transparent">
                        <span class="text-dark">Learn Git and GitHub fundamentals</span>
                        <button class="btn btn-outline-danger btn-sm" onclick="removeTask(this)">
                            <i class="bi bi-trash me-1"></i>Delete
                        </button>
                    </li>
                </ul>

                <div class="text-end">
                    <small class="text-muted" id="taskCount">Total Tasks: 1</small>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- สคริปต์การทำงาน -->
    <script>
        function updateTaskCount() {
            const count = document.querySelectorAll('#taskList li').length;
            document.getElementById('taskCount').innerText = `Total Tasks: ${count}`;
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const taskText = input.value.trim();

            if (taskText === '') {
                alert('Please enter a valid task.');
                return;
            }

            const taskList = document.getElementById('taskList');
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center py-3 bg-transparent';

            li.innerHTML = `
                <span class="text-dark">${taskText}</span>
                <button class="btn btn-outline-danger btn-sm" onclick="removeTask(this)">
                    <i class="bi bi-trash me-1"></i>Delete
                </button>
            `;

            taskList.appendChild(li);
            input.value = '';
            updateTaskCount();
        }

        function removeTask(button) {
            const li = button.closest('li');
            li.remove();
            updateTaskCount();
        }
    </script>
</body>

</html>
